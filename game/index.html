<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="An original offline coastal city adventure with eight story contracts, five vehicle classes and a living harbor.">
  <meta name="theme-color" content="#080e1d">
  <title>Neon Harbor — Night Shift</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080e1d;
      color: #f5f1ec;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #hint {
      position: fixed;
      left: 16px;
      bottom: 12px;
      color: #aab7ca;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Neon Harbor open world driving game. Press Enter to start, H for controls."></canvas>
  <div id="hint">H controls&nbsp;&nbsp; · &nbsp;&nbsp;WASD move / drive&nbsp;&nbsp; · &nbsp;&nbsp;E enter&nbsp;&nbsp; · &nbsp;&nbsp;Esc pause&nbsp;&nbsp; · &nbsp;&nbsp;M audio</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
